<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Temperature Converter | Pallavi Kumari</title>

    <link rel="stylesheet" href="style.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <div class="header">
            <div class="thermometer">🌡️</div>

            <p class="small-heading">SMART TEMPERATURE TOOL</p>

            <h1>Temperature <span>Converter</span></h1>

            <p class="subtitle">
                Convert temperatures easily between Celsius, Fahrenheit and Kelvin.
            </p>
        </div>


        <!-- Converter Card -->
        <div class="converter-card">

            <!-- Input -->
            <div class="input-group">

                <label for="temperature">
                    Enter Temperature
                </label>

                <input
                    type="number"
                    id="temperature"
                    placeholder="Enter a temperature"
                    step="any"
                >

            </div>


            <!-- Unit -->
            <div class="input-group">

                <label for="unit">
                    Convert From
                </label>

                <select id="unit">

                    <option value="celsius">
                        Celsius (°C)
                    </option>

                    <option value="fahrenheit">
                        Fahrenheit (°F)
                    </option>

                    <option value="kelvin">
                        Kelvin (K)
                    </option>

                </select>

            </div>


            <!-- Convert Button -->
            <button onclick="convertTemperature()">
                Convert Temperature
            </button>


            <!-- Error Message -->
            <p id="error-message"></p>


            <!-- Results -->
            <div id="results" class="results">

                <h2>Conversion Results</h2>

                <div class="result-container">

                    <div class="result-box">
                        <span>°C</span>
                        <h3 id="celsius-result">--</h3>
                        <p>Celsius</p>
                    </div>

                    <div class="result-box">
                        <span>°F</span>
                        <h3 id="fahrenheit-result">--</h3>
                        <p>Fahrenheit</p>
                    </div>

                    <div class="result-box">
                        <span>K</span>
                        <h3 id="kelvin-result">--</h3>
                        <p>Kelvin</p>
                    </div>

                </div>

            </div>

        </div>


        <!-- Footer -->
        <footer>
            <p>
                Designed & built by <strong>Pallavi Kumari</strong>
            </p>

            <p class="copyright">
                © 2026 Pallavi Kumari
            </p>
        </footer>

    </div>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
